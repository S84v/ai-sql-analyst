[project]
name = "ai-sql-analyst"
version = "0.1.0"
description = "Natural-language analytical agent over PostgreSQL using LangGraph, FastAPI, and MCP"
readme = "README.md"
authors = [
    { name = "Sarang Dave", email = "131434471+S84v@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-sql-analyst-mcp = "ai_sql_analyst.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
